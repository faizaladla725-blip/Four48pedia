<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JKT48 HUB — IDN Smart Bridge</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;800&family=Syne:wght@800&display=swap" rel="stylesheet">
    <style>
        :root { --accent: #ff004c; --idn-blue: #0056ff; --bg: #030303; }
        body { font-family: 'Outfit', sans-serif; background: var(--bg); color: white; }
        .syne { font-family: 'Syne', sans-serif; }
        .glass { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(15px); border: 1px solid rgba(255, 255, 255, 0.08); }
        
        /* Layout Theater */
        #theater-overlay { display: none; position: fixed; inset: 0; z-index: 9999; background: #000; flex-direction: column; }
        iframe { width: 100%; height: 100%; border: none; }
    </style>
</head>
<body class="pb-20">

    <div id="theater-overlay">
        <div class="p-4 glass flex justify-between items-center">
            <h2 id="active-member" class="syne text-xs uppercase italic tracking-[0.3em]">Loading Stage...</h2>
            <button onclick="closeTheater()" class="bg-rose-600 px-6 py-2 rounded-full text-[10px] font-black uppercase">Close Stage</button>
        </div>
        <iframe id="main-frame" allow="autoplay; fullscreen"></iframe>
    </div>

    <nav class="sticky top-0 z-40 glass border-b border-white/5 px-8 py-6 mb-12">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <div class="syne text-3xl font-extrabold italic tracking-tighter uppercase">
                JKT<span class="text-rose-600">HUB</span>
            </div>
            <div id="live-indicator" class="flex items-center gap-2 bg-rose-600/10 px-4 py-2 rounded-xl border border-rose-600/20">
                <div class="w-2 h-2 bg-rose-600 rounded-full animate-ping"></div>
                <span id="live-count" class="text-[10px] font-black uppercase text-rose-500 tracking-widest">Checking...</span>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-8">
        <div class="mb-12">
            <input type="text" id="memberSearch" placeholder="Cari member yang sedang live..." 
                   class="w-full md:w-96 bg-white/5 border border-white/10 px-6 py-4 rounded-2xl outline-none focus:border-rose-600 transition-all text-sm"
                   onkeyup="filterMembers()">
        </div>

        <section>
            <div id="live-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
                </div>
        </section>
    </main>

    <script>
        let liveData = [];

        async function getLive() {
            try {
                const res = await fetch('https://api.crstlnz.my.id/api/now_live?group=jkt48');
                liveData = await res.json();
                renderLive(liveData);
                document.getElementById('live-count').innerText = `${liveData.length} LIVE NOW`;
            } catch (e) { console.error("Gagal sinkronisasi data."); }
        }

        function renderLive(list) {
            const container = document.getElementById('live-grid');
            if (list.length === 0) {
                container.innerHTML = `<div class="col-span-full py-20 text-center glass rounded-[3rem] opacity-20 uppercase tracking-[0.5em]">Belum ada member live</div>`;
                return;
            }

            container.innerHTML = list.map(m => {
                // DETEKSI PLATFORM
                const isIDN = m.type.toLowerCase().includes('idn');
                
                return `
                <div class="glass rounded-[2.5rem] overflow-hidden group member-card">
                    <div class="relative aspect-video">
                        <img src="${m.img}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-700">
                        <div class="absolute inset-0 bg-gradient-to-t from-black via-transparent to-transparent"></div>
                        <div class="absolute top-6 left-6">
                            <span class="${isIDN ? 'bg-blue-600' : 'bg-rose-600'} px-3 py-1 rounded text-[8px] font-black uppercase tracking-widest">
                                ${m.type}
                            </span>
                        </div>
                    </div>
                    <div class="p-8">
                        <h3 class="syne text-xl uppercase italic mb-1">${m.name}</h3>
                        <p class="text-[10px] text-white/30 font-bold mb-6 tracking-widest uppercase">${m.viewers.toLocaleString()} Penonton</p>
                        
                        ${isIDN ? 
                            `<a href="${m.url}" target="_blank" class="block w-full text-center bg-[#0056ff] hover:bg-blue-700 text-white py-4 rounded-2xl text-[10px] font-black uppercase shadow-lg shadow-blue-600/20 transition-all">
                                Buka IDN App / Web ↗
                            </a>` : 
                            `<button onclick="openStage('${m.room_id}', '${m.name}')" class="w-full bg-white text-black py-4 rounded-2xl text-[10px] font-black uppercase hover:bg-rose-600 hover:text-white transition-all shadow-lg">
                                Nonton di Web
                            </button>`
                        }
                    </div>
                </div>`;
            }).join('');
        }

        function filterMembers() {
            const query = document.getElementById('memberSearch').value.toLowerCase();
            const filtered = liveData.filter(m => m.name.toLowerCase().includes(query));
            renderLive(filtered);
        }

        function openStage(roomId, name) {
            const overlay = document.getElementById('theater-overlay');
            const frame = document.getElementById('main-frame');
            // Hanya untuk Showroom
            frame.src = `https://www.showroom-live.com/streaming/embed?room_id=${roomId}&stop_on_unfocus=0&autoplay=1&muted=1`;
            document.getElementById('active-member').innerText = `Watching: ${name}`;
            overlay.style.display = 'flex';
            document.body.style.overflow = 'hidden';
        }

        function closeTheater() {
            document.getElementById('theater-overlay').style.display = 'none';
            document.getElementById('main-frame').src = '';
            document.body.style.overflow = 'auto';
        }

        getLive();
        setInterval(getLive, 30000); // Update tiap 30 detik
    </script>
</body>
    </html>
